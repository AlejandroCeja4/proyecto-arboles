<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arboles</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <header>
                <h1>Ceja Cervantes<span>Alejandro</span></h1>
                <p>Estructuras de datos</p>
            </header>

            <section class="controls">
                <div class="input-group">
                    <input type="text" id="node-value" placeholder="Ej: 3x^2, 5x, 7"
                        aria-label="Expresión del nodo">
                    <button id="add-btn" class="primary-btn">Añadir</button>
                </div>

                <div class="input-group">
                    <input type="number" id="x-value" placeholder="Valor de x"
                        aria-label="Valor de x">
                    <button id="evaluate-btn" class="primary-btn">Evaluar</button>
                </div>

                <div class="actions">
                    <button id="reset-btn" class="secondary-btn">Reiniciar Árbol</button>
                </div>

                <div class="traversals">
                    <h3>Recorridos Manuales</h3>
                    <div class="traversal-btns">
                        <button data-type="pre" class="traversal-btn">Pre-orden</button>
                        <button data-type="in" class="traversal-btn">In-orden</button>
                        <button data-type="post" class="traversal-btn">Post-orden</button>
                    </div>
                    <button id="next-step-btn" class="step-btn hidden">Siguiente Paso →</button>
                </div>
            </section>

            <section class="info-panel">
                <div id="indicators-container" class="status-indicators"></div>

                <div id="traversal-result" class="result-box"></div>

                <div id="evaluation-result" class="result-box"></div>

                <div id="error-box" class="result-box error hidden"></div>
            </section>
        </aside>

        <main class="canvas-area">
            <svg id="tree-svg">
                <g id="links-group"></g>
                <g id="nodes-group"></g>
            </svg>
            <div id="status-bubble" class="hidden"></div>
        </main>
    </div>

    <script>
        const API = "";

        const nodeInput = document.getElementById("node-value");
        const xInput = document.getElementById("x-value");
        const addBtn = document.getElementById("add-btn");
        const evalBtn = document.getElementById("evaluate-btn");
        const resetBtn = document.getElementById("reset-btn");

        const errorBox = document.getElementById("error-box");
        const evalBox = document.getElementById("evaluation-result");

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.remove("hidden");
        }

        function clearError() {
            errorBox.textContent = "";
            errorBox.classList.add("hidden");
        }

        async function addNode() {
            clearError();

            const value = nodeInput.value.trim();

            if (!value) {
                showError("Debe ingresar una expresión");
                return;
            }

            try {
                const res = await fetch(API + "/add", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ value })
                });

                const data = await res.json();

                if (!res.ok) {
                    showError(data.detail || "Error al agregar");
                    return;
                }

                if (data.status === "error") {
                    showError(data.message);
                    return;
                }

                nodeInput.value = "";
                loadTree();

            } catch (error) {
                showError("Error de conexión con el servidor");
            }
        }

        async function evaluateTree() {
            clearError();

            const x = xInput.value;

            if (x === "") {
                showError("Debe ingresar un valor de x");
                return;
            }

            try {
                const res = await fetch(API + "/evaluate", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ x })
                });

                const data = await res.json();

                if (!res.ok) {
                    showError(data.detail || "Error al evaluar");
                    return;
                }

                renderEvaluation(data.resultados);

            } catch (error) {
                showError("Error al conectar con el servidor");
            }
        }

        function renderEvaluation(resultados) {
            evalBox.innerHTML = "";

            resultados.forEach(item => {
                const div = document.createElement("div");

                if (item.error) {
                    div.textContent = `${item.expresion} → Error: ${item.error}`;
                    div.style.color = "red";
                } else {
                    div.textContent = `${item.expresion} = ${item.resultado}`;
                }

                evalBox.appendChild(div);
            });
        }

        async function resetTree() {
            clearError();

            try {
                await fetch(API + "/reset", { method: "POST" });
                evalBox.innerHTML = "";
                loadTree();
            } catch (error) {
                showError("Error al reiniciar");
            }
        }

        async function loadTree() {
            try {
                const res = await fetch(API + "/tree");
                const data = await res.json();
                console.log("Tree:", data);
            } catch (error) {
                showError("Error al cargar el árbol");
            }
        }

        addBtn.addEventListener("click", addNode);
        evalBtn.addEventListener("click", evaluateTree);
        resetBtn.addEventListener("click", resetTree);

        loadTree();
    </script>
</body>

</html>
