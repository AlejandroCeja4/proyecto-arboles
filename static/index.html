<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arboles</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
<div class="app-container">
    <aside class="sidebar">
        <header>
            <h1>Diagrama de <span>Arboles</span></h1>
            <p>Estructuras de datos</p>
        </header>

        <section class="controls">
            <div class="control-group">
                <h3>Gestión de Nodos</h3>
                <div class="input-group">
                    <input type="number" id="node-value" placeholder="Valor" aria-label="Valor del nodo">
                    <button id="add-btn" class="primary-btn">Aañadir</button>
                </div>
                <div class="button-grid">
                    <button id="delete-btn" class="secondary-btn">Eliminar Nodo</button>
                    <button id="subtree-btn" class="secondary-btn">Eliminar Subárbol</button>
                    <button id="balance-btn" class="secondary-btn">Equilibrar</button>
                    <button id="random-btn" class="secondary-btn">Aleatorio</button>
                    <button id="reset-btn" class="danger-btn">Reiniciar Todo</button>
                </div>
            </div>

            <div class="control-group">
                <h3>Expresiones</h3>
                <div class="input-group">
                    <input type="text" id="expression-input" placeholder="Ej: (X + 2) ^ 2">
                    <button id="expression-btn" class="primary-btn">Generar</button>
                </div>
                <div id="variables-container" class="variables-panel hidden">
                    <h4>Variables detectadas</h4>
                    <div id="variables-inputs"></div>
                    <button id="evaluate-btn" class="accent-btn">Evaluar Expresión</button>
                    <div id="evaluation-result" class="eval-result"></div>
                </div>
            </div>

            <div class="control-group">
                <h3>Importar</h3>
                <div class="file-input-wrapper">
                    <input type="file" id="json-file" class="hidden">
                    <label for="json-file" class="file-label">Seleccionar JSON</label>
                    <button id="load-json-btn" class="primary-btn">Cargar</button>
                </div>
            </div>

            <div class="traversals">
                <h3>Recorridos Manuales</h3>
                <div class="traversal-btns">
                    <button data-type="pre" class="traversal-btn">Pre-orden</button>
                    <button data-type="in" class="traversal-btn">In-orden</button>
                    <button data-type="post" class="traversal-btn">Post-orden</button>
                </div>
                <button id="next-step-btn" class="step-btn hidden">Siguiente Paso →</button>
            </div>
        </section>

        <section class="info-panel">
            <div id="indicators-container" class="status-indicators">
                <!-- Dinámico -->
            </div>
            <div id="traversal-result" class="result-box">
                <!-- Sin placeholders -->
            </div>
        </section>
    </aside>

    <main class="canvas-area">
        <svg id="tree-svg">
            <g id="links-group"></g>
            <g id="nodes-group"></g>
        </svg>
        <div id="status-bubble" class="hidden"></div>
    </main>
</div>
<script src="script.js"></script>
</body>

</html>
