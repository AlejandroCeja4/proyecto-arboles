<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arboles</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <header>
                <h1>Ceja Cervantes<span>Alejandro</span></h1>
                <p>Estructuras de datos</p>
            </header>

            <section class="controls">
                <div class="input-group">
                    <input type="number" id="node-value" placeholder="Valor" aria-label="Valor del nodo">
                    <button id="add-btn" class="primary-btn">Añadir</button>
                </div>

                <div class="actions">
                    <button id="reset-btn" class="secondary-btn">Reiniciar Árbol</button>
                </div>

                <div class="traversals">
                    <h3>Recorridos Manuales</h3>
                    <div class="traversal-btns">
                        <button data-type="pre" class="traversal-btn">Pre-orden</button>
                        <button data-type="in" class="traversal-btn">In-orden</button>
                        <button data-type="post" class="traversal-btn">Post-orden</button>
                    </div>
                    <button id="next-step-btn" class="step-btn hidden">Siguiente Paso →</button>
                </div>
            </section>

            <section class="info-panel">
                <div id="indicators-container" class="status-indicators">
                    <!-- Dinámico -->
                </div>
                <div id="traversal-result" class="result-box">
                    <!-- Sin placeholders -->
                </div>
            </section>
        </aside>

        <main class="canvas-area">
            <svg id="tree-svg">
                <g id="links-group"></g>
                <g id="nodes-group"></g>
            </svg>
            <div id="status-bubble" class="hidden"></div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
